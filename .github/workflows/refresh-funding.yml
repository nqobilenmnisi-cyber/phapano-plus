name: Refresh official funding sources

on:
  workflow_dispatch:
  schedule:
    # Monday 05:00 in Johannesburg (03:00 UTC). Johannesburg does not use DST.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: funding-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Monitor approved official sources
        run: npm run funding:refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
