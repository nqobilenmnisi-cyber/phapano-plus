name: Apply public refinement

on:
  push:
    branches:
      - feature/refine-public-experience
    paths:
      - .github/workflows/apply-refinement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/refine-public-experience
          fetch-depth: 0

      - name: Apply verified patch
        run: |
          git apply phapano-refine-public-experience.patch
          unlink phapano-refine-public-experience.patch
          unlink .github/workflows/apply-refinement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine public navigation and My Pathway"
          git push origin HEAD:feature/refine-public-experience
